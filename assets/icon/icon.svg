<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101628"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.42" cy="0.40" r="0.45">
      <stop offset="0" stop-color="#7A1030" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7A1030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGas" cx="0.66" cy="0.30" r="0.40">
      <stop offset="0" stop-color="#00C9A0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00C9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FF5A74"/>
      <stop offset="0.55" stop-color="#E0213F"/>
      <stop offset="1" stop-color="#8E0B24"/>
    </linearGradient>
    <linearGradient id="gas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#00E08A"/>
    </linearGradient>
    <linearGradient id="gasV" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#00E08A"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowRed)"/>
  <rect width="1024" height="1024" fill="url(#glowGas)"/>

  <!-- blood drop -->
  <g transform="translate(410 -48)">
    <path d="M0 118 C 0 118 -178 346 -178 452 A 178 178 0 0 0 178 452 C 178 346 0 118 0 118 Z" fill="#E0213F" opacity="0.45" filter="url(#blur)"/>
    <path d="M0 118 C 0 118 -178 346 -178 452 A 178 178 0 0 0 178 452 C 178 346 0 118 0 118 Z" fill="url(#drop)"/>
    <!-- highlight -->
    <path d="M-104 420 C -104 360 -60 290 -30 250" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- small bubbles inside the drop, rising -->
    <circle cx="48" cy="520" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7"/>
    <circle cx="96" cy="452" r="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="6"/>
    <circle cx="0" cy="585" r="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5"/>
  </g>

  <!-- gas bubbles escaping up-right (highlighted element) -->
  <g transform="translate(0 -48)">
    <!-- CO2 bubble -->
    <circle cx="768" cy="408" r="92" fill="url(#gasV)" opacity="0.35" filter="url(#blur)"/>
    <circle cx="768" cy="408" r="88" fill="#0A1A24" fill-opacity="0.65" stroke="url(#gasV)" stroke-width="14"/>
    <text x="768" y="433" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="70" fill="#E8FFF8">CO<tspan font-size="42" dy="16">2</tspan></text>
    <!-- O2 bubble -->
    <circle cx="700" cy="196" r="72" fill="url(#gasV)" opacity="0.35" filter="url(#blur)"/>
    <circle cx="700" cy="196" r="68" fill="#0A1A24" fill-opacity="0.65" stroke="url(#gasV)" stroke-width="12"/>
    <text x="694" y="218" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="62" fill="#E8FFF8">O<tspan font-size="38" dy="14">2</tspan></text>
    <!-- tiny trailing bubbles -->
    <circle cx="628" cy="498" r="20" fill="none" stroke="url(#gasV)" stroke-width="8"/>
    <circle cx="872" cy="262" r="16" fill="none" stroke="url(#gasV)" stroke-width="7"/>
    <circle cx="612" cy="318" r="12" fill="url(#gasV)"/>
  </g>

  <!-- wordmark -->
  <text x="527" y="684" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="64" letter-spacing="30" fill="#FFFFFF" fill-opacity="0.78">BLOOD</text>
  <text x="516" y="906" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="236" letter-spacing="8" fill="url(#gas)" opacity="0.55" filter="url(#blurS)">GAS</text>
  <text x="516" y="906" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="236" letter-spacing="8" fill="url(#gas)">GAS</text>
</svg>
